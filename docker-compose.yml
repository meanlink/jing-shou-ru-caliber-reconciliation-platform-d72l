name: elimination-desk
services:
  backend:
    build: ./backend
    container_name: elimination-desk-backend
    environment:
      ELIM_DB_PATH: /data/elimination.db
      SEED_DEMO: ${SEED_DEMO:-true}
      HOST: 0.0.0.0
      PORT: 8000
    ports: ["${BACKEND_PORT:-19217}:8000"]
    volumes: ["elim-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 4s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    container_name: elimination-desk-frontend
    ports: ["${FRONTEND_PORT:-18217}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 4s
      timeout: 3s
      retries: 20
volumes:
  elim-data:
